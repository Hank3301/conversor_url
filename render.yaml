# Blueprint do Render (plano free, sem cartão).
# Passos: crie o repositório no GitHub, suba este arquivo, e no Render
# use "New > Blueprint" apontando para o repositório.
services:
  - type: web
    name: conversor-url
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MAX_DURATION_MINUTES
        value: "20"
      - key: MAX_FILESIZE_MB
        value: "2048"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_HEIGHT
        value: "1080"
      # Preencha no painel do Render (não comite valores).
      - key: COOKIES_B64
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
