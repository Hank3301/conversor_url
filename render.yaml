# Blueprint do Render (plano free, sem cartão).
#
# Como publicar: https://dashboard.render.com > New > Blueprint > escolha o
# repositório Hank3301/conversor_url > Apply. Nenhum campo para preencher.
#
# Segredos (COOKIES_B64) entram depois, em Environment, no painel do serviço.
services:
  - type: web
    name: conversor-url
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Limites calibrados para 512 MB de RAM e menos de 1 CPU.
      - key: MAX_DURATION_MINUTES
        value: "20"
      - key: MAX_FILESIZE_MB
        value: "2048"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_HEIGHT
        value: "1080"
      - key: RESOLVE_PER_MINUTE
        value: "10"
      - key: DOWNLOADS_PER_10MIN
        value: "3"
      - key: JOB_TTL_MINUTES
        value: "15"
